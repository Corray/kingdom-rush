# ============================================================
# kingdom-rush — Project ENV
# ============================================================
#
# 维护方: PM
# 消费方: agent (启动时读) + skills (按需引用)
# Spec:   <standard_path>/docs/concepts/project-env-spec.md
#
# ============================================================

project:
  name: kingdom-rush
  flow_type: github
  code_repo: kingdom-rush


# ============================================================
# GitHub 流派配置
# ============================================================
github:
  # Issue tracker 仓库 — owner/repo 格式
  issue_repo: Corray/kingdom-rush

  # 协作 hub repo — 单仓库项目通常同 issue_repo
  hub_repo: Corray/kingdom-rush

  # 当前活跃 milestone（可选，简单项目可省）
  # active_milestones:
  #   - name: <milestone-name>
  #     phase: <phase-description>
  #     started: <YYYY-MM-DD>
  #     due: <YYYY-MM-DD>


# ============================================================
# 通知配置
# ============================================================
notify:
  # TODO: 个人项目暂无群机器人 webhook，需要 release / 阻塞通知时再配
  qiwei_webhook: TBD-not-configured


