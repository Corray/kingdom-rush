# kingdom-rush V1.5 — 10 关数据
#
# cps:    路径控制点列表 (相邻 cp 必须水平或垂直对齐, 否则 load 报错)
#         代码会自动 expand 中间 cells
# waves:  每波敌人组成 DSL
#         token 格式: <kind><count>  kind: n=Normal, f=Fast
#         多 token 空格分隔, 按顺序 spawn
#         例: "n5 f2 n3" = 5 normal -> 2 fast -> 3 normal

